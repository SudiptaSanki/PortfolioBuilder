<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO FIX | Arcade Restorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231e1b4b'/%3E%3Ctext x='50' y='67' font-family='system-ui, -apple-system, sans-serif' font-size='60' font-weight='bold' fill='%23f472b6' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body>
  
  
  <nav style="display:flex; justify-content:space-between; padding:20px; position:absolute; top:0; width:100%; z-index:100;">
    <div style="font-weight:bold; font-size:1.2rem; color:inherit; text-transform:uppercase;">CRT Cabinet Arcade Restorer</div>
    <div style="display:flex; gap:20px;">
      <a href="index.html" style="color:inherit; text-decoration:none; font-weight:500;">Home</a>
      <a href="about.html" style="color:inherit; text-decoration:none; font-weight:500;">About</a>
      <a href="projects.html" style="color:inherit; text-decoration:none; font-weight:500;">Projects</a>
      <a href="contact.html" style="color:inherit; text-decoration:none; font-weight:500;">Contact</a>
    </div>
  </nav>
  
  <main style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:6rem 2rem 2rem; text-align:center;">
    <div style="background:rgba(0,0,0,0.65); padding:3rem; border-radius:12px; max-width:600px; width:100%; backdrop-filter:blur(12px); color:#fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
      <h1 style="margin-bottom:1rem; font-size:3rem; text-transform:uppercase;">Let's Collaborate</h1>
      <p style="font-size:1.1rem; line-height:1.6; margin-bottom: 2rem; color:#ddd;">Interested in hiring a creative? Reach out for bookings, inquiries, or just to say hello.</p>
      
      <form style="display:flex; flex-direction:column; gap:15px; text-align:left;">
        <input type="text" placeholder="Your Name" style="padding:12px; border-radius:6px; border:none; outline:none; background:rgba(255,255,255,0.95); font-family:inherit;">
        <input type="email" placeholder="Your Email" style="padding:12px; border-radius:6px; border:none; outline:none; background:rgba(255,255,255,0.95); font-family:inherit;">
        <textarea placeholder="Your Message" rows="5" style="padding:12px; border-radius:6px; border:none; outline:none; background:rgba(255,255,255,0.95); resize:vertical; font-family:inherit;"></textarea>
        <button type="button" style="padding:14px; background:#fff; color:#000; font-weight:bold; font-size:1.1rem; border:none; border-radius:6px; cursor:pointer; text-transform:uppercase; letter-spacing:1px; margin-top:10px;">Send Message</button>
      </form>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
