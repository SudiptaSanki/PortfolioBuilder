<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="The refused design plate: a machined metal ring as first drawn, refused at review, beside the flame-edged disc that replaced it">
  <rect x="0" y="0" width="880" height="480" fill="#f4ead2"/>
  <rect x="12" y="12" width="856" height="456" fill="none" stroke="#3a2a16" stroke-width="2.2"/>
  <rect x="21" y="21" width="838" height="438" fill="none" stroke="#a03a2a" stroke-width="1.1"/>
  <!-- left panel: as drawn -->
  <rect x="48" y="48" width="380" height="330" fill="#ccd3d6" stroke="#3a2a16" stroke-width="1.8"/>
  <g>
    <circle cx="238" cy="196" r="86" fill="none" stroke="#77828c" stroke-width="20"/>
    <circle cx="238" cy="196" r="86" fill="none" stroke="#4c565f" stroke-width="2"/>
    <circle cx="238" cy="196" r="62" fill="none" stroke="#4c565f" stroke-width="1.6"/>
    <circle cx="238" cy="196" r="20" fill="#9aa5ad" stroke="#4c565f" stroke-width="2"/>
    <g fill="#4c565f">
      <rect x="232" y="98" width="12" height="16"/><rect x="232" y="278" width="12" height="16"/>
      <rect x="140" y="190" width="16" height="12"/><rect x="320" y="190" width="16" height="12"/>
      <rect x="168" y="128" width="12" height="14" transform="rotate(-45 174 135)"/><rect x="296" y="250" width="12" height="14" transform="rotate(-45 302 257)"/>
      <rect x="296" y="128" width="14" height="12" transform="rotate(45 303 134)"/><rect x="166" y="250" width="14" height="12" transform="rotate(45 173 256)"/>
    </g>
    <path d="M196 300 L280 300 L296 344 L180 344 Z" fill="#77828c" stroke="#4c565f" stroke-width="1.8"/>
    <rect x="164" y="344" width="148" height="12" fill="#4c565f"/>
    <!-- review annotation marks -->
    <g stroke="#a03a2a" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M128 118 l14 14 M142 118 l-14 14"/>
      <path d="M330 250 l14 14 M344 250 l-14 14"/>
      <path d="M96 300 q60 22 120 6" stroke-dasharray="7 6"/>
    </g>
    <!-- refused band -->
    <g transform="rotate(-14 238 330)">
      <rect x="88" y="312" width="300" height="38" fill="#a03a2a"/>
      <text x="238" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="4" fill="#f4ead2">REFUSED · GATE 2</text>
    </g>
    <text x="238" y="412" text-anchor="middle" font-family="Georgia, serif" font-size="16.5" letter-spacing="2.5" fill="#3a2a16">AS DRAWN — 2024</text>
    <text x="238" y="436" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5a4632">a machined ring, bright and cold</text>
  </g>
  <!-- right panel: as replaced -->
  <rect x="452" y="48" width="380" height="330" fill="#efe0c0" stroke="#3a2a16" stroke-width="1.8"/>
  <g>
    <!-- flame rim: alternating triangles -->
    <g fill="#cf9a33" stroke="#3a2a16" stroke-width="1.3">
      <path d="M662 92 l10 30 -20 0 Z"/><path d="M662 300 l10 -30 -20 0 Z"/>
      <path d="M558 196 l30 -10 0 20 Z"/><path d="M766 196 l-30 -10 0 20 Z"/>
      <path d="M588 122 l26 16 -14 14 Z"/><path d="M736 270 l-26 -16 14 -14 Z"/>
      <path d="M736 122 l-14 16 -12 -14 Z" transform="translate(-12 0)"/><path d="M588 270 l26 -16 -14 -14 Z"/>
    </g>
    <g fill="#a03a2a">
      <path d="M662 108 l7 22 -14 0 Z"/><path d="M662 284 l7 -22 -14 0 Z"/>
      <path d="M574 196 l22 -7 0 14 Z"/><path d="M750 196 l-22 -7 0 14 Z"/>
    </g>
    <circle cx="662" cy="196" r="66" fill="#cf9a33" stroke="#3a2a16" stroke-width="2.2"/>
    <circle cx="662" cy="196" r="50" fill="none" stroke="#a03a2a" stroke-width="3"/>
    <circle cx="662" cy="196" r="34" fill="#e3bc62" stroke="#3a2a16" stroke-width="1.6"/>
    <circle cx="662" cy="196" r="10" fill="#a03a2a"/>
    <path d="M620 300 L704 300 L720 344 L604 344 Z" fill="#8a5a24" stroke="#3a2a16" stroke-width="1.8"/>
    <rect x="588" y="344" width="148" height="12" fill="#5a4028"/>
    <text x="642" y="412" text-anchor="middle" font-family="Georgia, serif" font-size="16.5" letter-spacing="2.5" fill="#3a2a16">AS REPLACED — 2024</text>
    <text x="642" y="436" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5a4632">flame-edged, bright as midday</text>
  </g>
</svg>
