<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-label="Character turnaround plate: back, front and profile views of the Archer, with a colour script">
  <rect x="0" y="0" width="880" height="460" fill="#f4ead2"/>
  <rect x="12" y="12" width="856" height="436" fill="none" stroke="#3a2a16" stroke-width="2.2"/>
  <rect x="21" y="21" width="838" height="418" fill="none" stroke="#a03a2a" stroke-width="1.1"/>
  <!-- ground line and measure ticks -->
  <line x1="60" y1="392" x2="700" y2="392" stroke="#3a2a16" stroke-width="2.4"/>
  <g stroke="#3a2a16" stroke-width="1.4">
    <line x1="60" y1="392" x2="60" y2="402"/><line x1="140" y1="392" x2="140" y2="402"/><line x1="220" y1="392" x2="220" y2="402"/><line x1="300" y1="392" x2="300" y2="402"/><line x1="380" y1="392" x2="380" y2="402"/><line x1="460" y1="392" x2="460" y2="402"/><line x1="540" y1="392" x2="540" y2="402"/><line x1="620" y1="392" x2="620" y2="402"/><line x1="700" y1="392" x2="700" y2="402"/>
  </g>
  <!-- height measure, right of figures -->
  <line x1="716" y1="86" x2="716" y2="392" stroke="#3a2a16" stroke-width="1.4"/>
  <line x1="708" y1="86" x2="724" y2="86" stroke="#3a2a16" stroke-width="1.4"/>
  <line x1="708" y1="392" x2="724" y2="392" stroke="#3a2a16" stroke-width="1.4"/>

  <!-- BACK view, cx 180 -->
  <g stroke-linecap="round">
    <path d="M164 392 l4 -64 M196 392 l-4 -64" stroke="#b97a4e" stroke-width="11" fill="none"/>
    <path d="M152 268 L208 268 L214 332 L146 332 Z" fill="#a03a2a" stroke="#3a2a16" stroke-width="1.8"/>
    <line x1="148" y1="284" x2="212" y2="284" stroke="#cf9a33" stroke-width="4"/>
    <path d="M156 176 L204 176 L208 268 L152 268 Z" fill="#b97a4e"/>
    <path d="M156 190 q-16 34 -12 66 M204 190 q16 34 12 66" stroke="#b97a4e" stroke-width="11" fill="none"/>
    <!-- quiver across the back -->
    <path d="M158 186 L206 250 L192 262 L148 198 Z" fill="#5a4028" stroke="#3a2a16" stroke-width="1.6"/>
    <path d="M158 190 l-6 -18 M168 202 l-2 -19 M178 214 l2 -18" stroke="#3a2a16" stroke-width="3.2"/>
    <!-- hair and crown from behind -->
    <path d="M158 128 a22 24 0 0 1 44 0 l0 34 q-22 10 -44 0 Z" fill="#2b1c10"/>
    <path d="M154 122 q26 -22 52 0 l4 -16 q-30 -14 -60 0 Z" fill="#cf9a33" stroke="#3a2a16" stroke-width="1.5"/>
    <circle cx="180" cy="100" r="4" fill="#a03a2a"/>
    <text x="180" y="428" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#3a2a16">BACK</text>
  </g>

  <!-- FRONT view, cx 380 -->
  <g stroke-linecap="round">
    <path d="M364 392 l4 -64 M396 392 l-4 -64" stroke="#b97a4e" stroke-width="11" fill="none"/>
    <path d="M352 268 L408 268 L414 332 L346 332 Z" fill="#a03a2a" stroke="#3a2a16" stroke-width="1.8"/>
    <line x1="348" y1="284" x2="412" y2="284" stroke="#cf9a33" stroke-width="4"/>
    <path d="M356 176 L404 176 L408 268 L352 268 Z" fill="#b97a4e"/>
    <path d="M358 196 q22 12 44 0" stroke="#cf9a33" stroke-width="3.4" fill="none"/>
    <circle cx="380" cy="212" r="5" fill="#a03a2a"/>
    <path d="M356 190 q-16 34 -12 66 M404 190 q16 34 12 66" stroke="#b97a4e" stroke-width="11" fill="none"/>
    <circle cx="346" cy="258" r="5" fill="#cf9a33"/><circle cx="414" cy="258" r="5" fill="#cf9a33"/>
    <!-- face -->
    <ellipse cx="380" cy="140" rx="21" ry="25" fill="#b97a4e" stroke="#3a2a16" stroke-width="1.4"/>
    <path d="M362 138 q6 -4 12 0 M386 138 q6 -4 12 0" stroke="#3a2a16" stroke-width="2" fill="none"/>
    <path d="M372 156 q8 5 16 0" stroke="#3a2a16" stroke-width="2" fill="none"/>
    <path d="M354 122 q26 -24 52 0 l5 -18 q-31 -15 -62 0 Z" fill="#cf9a33" stroke="#3a2a16" stroke-width="1.5"/>
    <circle cx="380" cy="98" r="4.4" fill="#a03a2a"/>
    <path d="M380 108 l0 10" stroke="#a03a2a" stroke-width="2.4"/>
    <!-- bow held vertical at his left -->
    <path d="M428 150 Q452 236 428 330" fill="none" stroke="#5a4028" stroke-width="5.4"/>
    <line x1="428" y1="150" x2="428" y2="330" stroke="#8a5a24" stroke-width="1.6"/>
    <text x="380" y="428" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#3a2a16">FRONT</text>
  </g>

  <!-- PROFILE view, cx 580, facing left -->
  <g stroke-linecap="round">
    <path d="M566 392 l16 -62 M596 392 l-8 -62" stroke="#b97a4e" stroke-width="11" fill="none"/>
    <path d="M556 268 L606 268 L612 332 L550 332 Z" fill="#a03a2a" stroke="#3a2a16" stroke-width="1.8"/>
    <line x1="552" y1="284" x2="610" y2="284" stroke="#cf9a33" stroke-width="4"/>
    <path d="M562 176 L602 176 L606 268 L558 268 Z" fill="#b97a4e"/>
    <!-- forward arm holding the bow -->
    <path d="M566 196 q-30 6 -46 26" stroke="#b97a4e" stroke-width="11" fill="none"/>
    <path d="M600 196 q18 20 16 44" stroke="#b97a4e" stroke-width="11" fill="none"/>
    <!-- profile head -->
    <path d="M566 118 a21 24 0 0 1 38 6 l10 8 -8 6 q2 12 -6 20 l-2 14 -28 0 q-8 -26 -4 -54 Z" fill="#b97a4e" stroke="#3a2a16" stroke-width="1.4"/>
    <circle cx="580" cy="138" r="2.4" fill="#3a2a16"/>
    <path d="M560 112 q24 -22 48 -2 l4 -15 q-28 -13 -56 2 Z" fill="#cf9a33" stroke="#3a2a16" stroke-width="1.5"/>
    <circle cx="586" cy="90" r="4" fill="#a03a2a"/>
    <!-- quiver behind -->
    <path d="M600 190 l18 6 -6 44 -18 -6 Z" fill="#5a4028" stroke="#3a2a16" stroke-width="1.6"/>
    <path d="M606 194 l2 -17 M616 198 l6 -15" stroke="#3a2a16" stroke-width="3"/>
    <!-- bow in profile -->
    <path d="M498 158 Q524 240 498 326" fill="none" stroke="#5a4028" stroke-width="5.4"/>
    <line x1="498" y1="158" x2="498" y2="326" stroke="#8a5a24" stroke-width="1.6"/>
    <text x="580" y="428" text-anchor="middle" font-family="Georgia, serif" font-size="17" letter-spacing="3" fill="#3a2a16">PROFILE</text>
  </g>

  <!-- colour script -->
  <g font-family="Georgia, serif" font-size="11.5" fill="#3a2a16" letter-spacing="1">
    <text x="734" y="96" font-size="13" letter-spacing="1.6">COLOUR SCRIPT</text>
    <rect x="734" y="112" width="24" height="24" fill="#a03a2a" stroke="#3a2a16" stroke-width="1.2"/><text x="766" y="128">MADDER</text>
    <rect x="734" y="146" width="24" height="24" fill="#cf9a33" stroke="#3a2a16" stroke-width="1.2"/><text x="766" y="162">TURMERIC</text>
    <rect x="734" y="180" width="24" height="24" fill="#b97a4e" stroke="#3a2a16" stroke-width="1.2"/><text x="766" y="196">SKIN</text>
    <rect x="734" y="214" width="24" height="24" fill="#33517c" stroke="#3a2a16" stroke-width="1.2"/><text x="766" y="230">LAPIS</text>
    <rect x="734" y="248" width="24" height="24" fill="#5a4028" stroke="#3a2a16" stroke-width="1.2"/><text x="766" y="264">BARK</text>
    <text x="734" y="308" font-size="11">cloth, gold, skin,</text>
    <text x="734" y="326" font-size="11">sky, bow and quiver.</text>
    <text x="734" y="352" font-size="11">One palette, all three</text>
    <text x="734" y="370" font-size="11">views — no view invents</text>
    <text x="734" y="388" font-size="11">its own colours.</text>
  </g>
</svg>
