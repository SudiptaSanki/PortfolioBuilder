    <path d="M254 276 q12 -10 24 0 l3 -9 q-15 -7 -30 0 Z" fill="#3a2a16"/>
    <path d="M246 330 q22 10 44 0 l-4 14 -36 0 Z" fill="#cf9a33"/>
    <path d="M252 322 L286 314 L288 328 L254 334 Z" fill="#f4ead2" stroke="#3a2a16" stroke-width="1.4"/>
  </g>
  <!-- deer -->
  <g stroke-linecap="round">
