<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="Environment plate: a forest hermitage — a thatched hut, a seated reader under a great tree, a deer at the river">
  <rect x="0" y="0" width="880" height="480" fill="#f4ead2"/>
  <rect x="13" y="13" width="854" height="454" fill="none" stroke="#3a2a16" stroke-width="2.3"/>
  <rect x="22" y="22" width="836" height="436" fill="none" stroke="#a03a2a" stroke-width="1.1"/>
  <!-- sky through the canopy -->
  <rect x="24" y="24" width="832" height="300" fill="#b9c9a8"/>
  <circle cx="742" cy="92" r="34" fill="#cf9a33" stroke="#3a2a16" stroke-width="1.4"/>
  <!-- tree canopy bands -->
  <g fill="#2c5a41">
    <circle cx="120" cy="70" r="52"/><circle cx="220" cy="52" r="60"/><circle cx="330" cy="66" r="50"/><circle cx="470" cy="48" r="58"/><circle cx="600" cy="64" r="48"/><circle cx="712" cy="140" r="40"/>
  </g>
  <g fill="#3f7355">
    <circle cx="170" cy="96" r="34"/><circle cx="400" cy="88" r="36"/><circle cx="540" cy="92" r="30"/><circle cx="90" cy="120" r="26"/>
  </g>
  <g fill="#cf9a33">
    <circle cx="200" cy="70" r="4"/><circle cx="300" cy="50" r="4"/><circle cx="452" cy="66" r="4"/><circle cx="560" cy="80" r="4"/><circle cx="140" cy="100" r="4"/><circle cx="640" cy="60" r="4"/>
  </g>
  <!-- trunks -->
  <g stroke="#5a4028" fill="none" stroke-linecap="round">
    <path d="M212 330 q-6 -90 4 -170" stroke-width="17"/>
    <path d="M216 220 q-40 -26 -70 -28 M218 200 q36 -30 66 -34" stroke-width="9"/>
    <path d="M596 330 q4 -70 -2 -130" stroke-width="12"/>
    <path d="M96 330 q2 -60 -2 -104" stroke-width="10"/>
  </g>
  <!-- ground -->
  <path d="M24 324 L856 324 L856 400 L24 400 Z" fill="#7a9a6d"/>
  <path d="M24 324 Q300 308 560 320 Q760 328 856 318 L856 340 L24 340 Z" fill="#5b7d68"/>
  <g fill="#2c5a41">
    <circle cx="330" cy="352" r="6"/><circle cx="520" cy="366" r="7"/><circle cx="700" cy="350" r="5"/><circle cx="150" cy="372" r="6"/>
  </g>
  <!-- the hut -->
  <g stroke="#3a2a16" stroke-width="1.8">
    <rect x="392" y="282" width="120" height="62" fill="#efe0c0"/>
    <path d="M376 284 L452 238 L528 284 Z" fill="#b98d4f"/>
    <path d="M392 272 L452 240 L512 272 M386 278 L452 244 L518 278" stroke="#8a5a24" stroke-width="2.2" fill="none"/>
