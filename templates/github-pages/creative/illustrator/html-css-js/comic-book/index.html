  <nav style="display:flex; justify-content:space-between; padding:20px; position:absolute; top:0; width:100%; z-index:100;">

    <div style="display:flex; gap:20px;">
      <a href="index.html" style="color:inherit; text-decoration:none; font-weight:500;">Home</a>

    <div class="comic-container">
        <header class="comic-header card-border">
            <h1 class="comic-title">ART BY BUCK!</h1>
            <div class="sub-bubble">ILLUSTRATION & CHARACTER DESIGN</div>
        </header>

        <section class="comic-grid">
            <!-- Box 1 -->
            <div class="comic-panel sound-hover card-border">
                <div class="panel-img">
                    <img src="https://raw.githubusercontent.com/SudiptaSanki/PortfolioBuilder/main/assets/images/img_d5e8e6a2.webp" alt="Character sketch">
                </div>
                <div class="speech-bubble">
                    <p>I draw heroes!</p>
                </div>
            </div>

            <!-- Box 2 -->
            <div class="comic-panel sound-hover card-border yellow-bg">
                <div class="panel-img">
                    <img src="https://raw.githubusercontent.com/SudiptaSanki/PortfolioBuilder/main/assets/images/img_56cfe3b4.webp" alt="Digital art">
                </div>
                <div class="speech-bubble right">
                    <p>And alien worlds...</p>
                </div>
            </div>

            <!-- Box 3 -->
            <div class="comic-panel sound-hover card-border cyan-bg">
                <div class="panel-img">
                    <img src="https://raw.githubusercontent.com/SudiptaSanki/PortfolioBuilder/main/assets/images/img_60700a13.webp" alt="Retro design">
                </div>
                <div class="speech-bubble">
                    <p>POW! BOOM! SMASH!</p>
                </div>
            </div>

            <!-- Box 4 -->
            <div class="comic-panel sound-hover card-border text-panel red-bg">
                <div class="panel-meta">ISSUE #42</div>
                <h2>HI HIRE ME!</h2>

                <a href="mailto:buck@powillustrations.com" class="btn-bubble sound-hover">SEND SIGNAL</a>
