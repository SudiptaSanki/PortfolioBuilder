name: Validate Templates CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "validation-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Template Metadata & Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Templates
        run: node scripts/validate-templates.js

      - name: Test Catalog Compilation
        run: node scripts/generate-catalog.js
