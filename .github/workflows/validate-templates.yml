name: Validate Templates CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "validation-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Schema, Layout, Tests & Showcase Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: showcase/package-lock.json

      - name: Validate Templates & Canonical Layout
        run: node scripts/validate-templates.js

      - name: Run Architecture & Shard Tests
        run: node scripts/test-phase3-validation.js

      - name: Test Catalog Compilation
        run: node scripts/generate-catalog.js

      - name: Install Showcase Dependencies
        run: npm --prefix showcase ci

      - name: Build Showcase
        run: npm --prefix showcase run build
